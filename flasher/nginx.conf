# Config nginx para hostear el flasher (montar en /etc/nginx/conf.d/default.conf).
#
# Motivo: con la config por defecto nginx no manda Cache-Control, el navegador
# aplica caching heuristico y al publicar una version nueva de firmware se queda
# con el app.js/firmwares.json viejos. La pagina revalida siempre (barato, ETag)
# y los binarios —que llevan version+commit en el nombre— se cachean para siempre.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pagina y metadata: revalidar en cada carga.
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Firmwares: inmutables (el nombre incluye version y commit).
    location /firmware/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
